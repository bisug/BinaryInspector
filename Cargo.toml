[package]
name = "binary-inspector"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Safe, local inspection of executable binaries (ELF, PE, Mach-O)"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
libc = "0.2.190"
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[[bin]]
name = "binary-inspector"
path = "src/main.rs"

[[bin]]
name = "binary-inspector-gui"
path = "src/gui.rs"
required-features = ["gui"]
