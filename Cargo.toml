[package]
name = "binary-inspector"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "Safe, local inspection of ELF binaries"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[[bin]]
name = "binary-inspector"
path = "src/main.rs"

[[bin]]
name = "binary-inspector-gui"
path = "src/gui.rs"
