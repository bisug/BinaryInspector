[package]
name = "binary-inspector"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "Safe, local inspection of ELF binaries"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
libc = "0.2.189"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[[bin]]
name = "binary-inspector"
path = "src/main.rs"

[[bin]]
name = "binary-inspector-gui"
path = "src/gui.rs"
